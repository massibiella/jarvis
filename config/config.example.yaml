# Copy this file to ../config.yaml (repo root) and adjust as needed.
# config.yaml is gitignored — never commit real API keys or personal paths.

llm:
  provider: gemini
  model: gemini-flash-lite-latest
  api_key_env: GEMINI_API_KEY # name of the env var holding the key — never the key itself
  max_tokens: 4096

memory:
  root_dir: ./data/memory
  user_id: default # placeholder until multi-user auth lands

agent:
  system_prompt_file: null # optional path to override the built-in default system prompt

# Optional — disabled unless enabled: true. Checked only at process
# startup (no background scheduler): fires once per local calendar day
# if the current time falls in one of the windows below.
# checkin:
#   enabled: true
#   home: "123 Main St, Springfield"
#   work: "456 Office Rd, Springfield"
#   morning_start_hour: 5   # local 24h clock; morning window is [start, end)
#   morning_end_hour: 11
#   evening_start_hour: 17  # evening window is [start, 24)

# Each entry is either a local subprocess (stdio transport, `command`) or a
# remote server (Streamable HTTP + OAuth, `url`) — exactly one of the two.
# command[0] must be the server's own venv Python (or e.g. "npx" for an
# npm-distributed server) — it needs that server's own dependencies, not
# Jarvis's. `env` is optional — extra environment variables the subprocess
# needs beyond what it inherits by default (e.g. a path to an OAuth
# credentials file), only meaningful alongside `command`. Weather used to
# be here but was moved to a native tool (src/jarvis/tools/weather_tools.py)
# — see docs/PLAN.md for why. The --enable-tools whitelist below is a real,
# working example (Google Calendar's default tool set is bigger and costs
# more tool-schema tokens per turn than needed) — see docs/PLAN.md for the
# token-cost story. A `url` entry needs no local process — Jarvis opens a
# browser itself for one-time OAuth on first connect (see README.md).
# mcp_servers:
#   calendar:
#     command: ["npx", "@cocal/google-calendar-mcp", "--enable-tools", "list-events,create-event,update-event,delete-event,get-freebusy,get-current-time"]
#     env:
#       GOOGLE_OAUTH_CREDENTIALS: "/path/to/gcp-oauth.keys.json"
#   ibkr:
#     url: "https://api.ibkr.com/v1/api/mcp-public"

logging:
  level: WARNING # use INFO/DEBUG only when actively troubleshooting — INFO surfaces
                 # noisy third-party library internals too (e.g. every HTTP request)
