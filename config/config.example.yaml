# Copy this file to ../config.yaml (repo root) and adjust as needed.
# config.yaml is gitignored — never commit real API keys or personal paths.

llm:
  provider: gemini
  model: gemini-flash-lite-latest
  api_key_env: GEMINI_API_KEY # name of the env var holding the key — never the key itself
  max_tokens: 4096

memory:
  root_dir: ./data/memory
  user_id: default # placeholder until multi-user auth lands

agent:
  system_prompt_file: null # optional path to override the built-in default system prompt

# Each entry launches an MCP server as a subprocess (stdio transport).
# command[0] must be the server's own venv Python, not a bare "python" —
# it needs that server's dependencies installed, not Jarvis's.
# mcp_servers:
#   weather:
#     command: ["/path/to/weather-mcp/.venv/bin/python", "/path/to/weather-mcp/weather.py"]

logging:
  level: WARNING # use INFO/DEBUG only when actively troubleshooting — INFO surfaces
                 # noisy third-party library internals too (e.g. every HTTP request)
