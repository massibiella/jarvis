[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant agent — core skeleton"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.68",
    "pyyaml>=6.0",
    "google-genai>=2.18",
    "python-dotenv>=1.2",
    "mcp>=2.0",
    "httpx2>=2.10",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[project.scripts]
jarvis-cli = "jarvis.cli:main"
jarvis = "jarvis.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
